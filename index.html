<style>
:root{--bg:#faf4f5;--cd:#fff;--tx:#1c1c1e;--mu:#6e6e73;--pr:#9c1f3d;--ac:#b23252;--ok:#1f9254;--bad:#d92d3b;--bd:#ecdfe2}
:root[data-theme="dark"]{--bg:#121012;--cd:#1c191b;--tx:#f5f0f1;--mu:#a3999b;--pr:#d6486a;--ac:#e06687;--ok:#34c977;--bad:#f0555f;--bd:#332c2e}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:520px;margin:0 auto;padding:14px 14px 90px}
h1{margin:0;font-size:26px;font-weight:800}h3{margin:0 0 10px}small{color:var(--mu)}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 6px 18px -8px rgba(0,0,0,.08)}
.row{display:flex;align-items:center;gap:10px;cursor:pointer}.fl{flex:1;min-width:0}.fl b,.fl small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.em{font-size:26px;width:44px;height:44px;border-radius:13px;background:var(--bg);display:grid;place-items:center;flex:none;overflow:hidden}
.em img{width:100%;height:100%;object-fit:cover}
.hero{background:var(--pr);color:#fff;border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 10px 26px -10px color-mix(in srgb,var(--pr) 70%,transparent)}.hero small{color:#f2d3da}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.two b{font-size:20px;display:block}.hero .ok{color:#bbf7d0}.hero .bad{color:#fecaca}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--cd);margin-bottom:8px}
button{border:0;border-radius:14px;padding:12px 14px;background:var(--bd);cursor:pointer}
.pri{background:var(--pr);color:#fff;width:100%;font-weight:700;margin-top:6px}.ghost{background:none;color:var(--mu);padding:8px}
.icon{background:none;color:var(--tx);padding:8px;font-size:18px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));background:var(--pr);color:#fff;font-weight:800;padding:14px 26px;border-radius:30px;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--pr) 65%,transparent);z-index:5}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.tab{white-space:nowrap;background:var(--cd);border:1px solid var(--bd);border-radius:14px}.tab.on,.chip.on,.seg .on{background:var(--pr);color:#fff;border-color:var(--pr)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chip{padding:8px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:14px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--pr);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;vertical-align:middle;box-shadow:0 4px 10px -4px color-mix(in srgb,var(--pr) 60%,transparent)}
.seg{display:flex;gap:6px;margin:6px 0}.seg button{flex:1}
.sp{display:flex;align-items:center;gap:8px}.sp label{flex:1}.sp input[type=number]{width:120px;margin:0 0 6px}.sp input[type=checkbox]{width:auto;margin:0 6px 0 0}
.x{background:none;color:var(--mu);padding:6px}.empty{text-align:center;color:var(--mu);padding:26px 0}
.bd{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;display:none;max-width:90%}
.bar{height:8px;border-radius:4px;background:var(--pr);margin-top:4px}.link{word-break:break-all;font-size:13px;background:var(--bg);padding:8px;border-radius:8px;margin:8px 0}
label{display:block;margin:6px 0;color:var(--mu);font-size:14px}
.thumb{width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin:6px 0}
.payer{display:flex;gap:8px;align-items:center;margin-bottom:6px}.payer select{margin:0}.payer input{margin:0;width:110px}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.stat:last-child{border:0}
.act{display:flex;gap:8px;align-items:flex-start}.act .em{width:34px;height:34px;font-size:16px}
.sw{display:flex;gap:6px}
</style></head><body><div id="app"></div><div id="toast"></div>

function payersOf(e){if(e.expense_payers&&e.expense_payers.length)return e.expense_payers.map(p=>[p.member_id,Number(p.amount)]);return[[e.paid_by,Number(e.amount)]]}
function bal(g){const n={};gmem(g).forEach(m=>n[m.id]=0);S.exps.filter(e=>e.group_id==g).forEach(e=>{payersOf(e).forEach(([mid,amt])=>n[mid]=(n[mid]||0)+amt);e.splits.forEach(s=>n[s.member_id]=(n[s.member_id]||0)-Number(s.share))});return n}
function settle(g){const n=bal(g),c=[],d=[];for(const k in n){if(n[k]>=1)c.push([k,n[k]]);else if(n[k]<=-1)d.push([k,-n[k]])}c.sort((a,b)=>b[1]-a[1]);d.sort((a,b)=>b[1]-a[1]);const r=[];let i=0,j=0;while(i<c.length&&j<d.length){const x=Math.min(c[i][1],d[j][1]);r.push({from:d[j][0],to:c[i][0],amt:x});c[i][1]-=x;d[j][1]-=x;if(c[i][1]<1)i++;if(d[j][1]<1)j++}return r}

async function compressImage(file,maxDim,quality){try{
 const bmp=await createImageBitmap(file);let w=bmp.width,h=bmp.height;
 if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim}else if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim}
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(bmp,0,0,w,h);
 const blob=await new Promise(res=>cv.toBlob(res,'image/jpeg',quality));
 return blob?new File([blob],'photo.jpg',{type:'image/jpeg'}):file
 }catch(e){return file}}
async function uploadFile(file,prefix,maxDim=1000,quality=0.7){const small=await compressImage(file,maxDim,quality);
 const path=prefix+'/'+crypto.randomUUID()+'.jpg';
 const up=await sb.storage.from('media').upload(path,small,{contentType:'image/jpeg'});if(up.error)throw up.error;
 return sb.storage.from('media').getPublicUrl(path).data.publicUrl}

if(S.tab=='h')body=(S.acts.filter(x=>x.group_id==g).map(x=>{const p=mem(x.actor_id);return `<div class="card act"><div class="em">${x.kind=='join'?'🎉':(x.kind=='payment'?'🤝':'💸')}</div><div class="fl"><b>${esc(p?p.name:'—')}</b> ${x.kind=='join'?t('joined'):t('added')} <b>${esc(x.detail||'')}</b><small>${new Date(x.created_at).toLocaleString()}</small></div></div>`}).join(''))||`<p class="empty">${t('noActivity')}</p>`;
return `<header><button class="ghost" onclick="S.gid=null;view()">← ${t('back')}</button><b>${G.photo_url?`<img src="${esc(G.photo_url)}" style="width:24px;height:24px;border-radius:6px;object-fit:cover;vertical-align:middle">`:esc(G.emoji)} ${esc(G.name)}</b>${topbar()}</header><div class="tabs">${tabs}</div>${body}${S.tab=='x'?`<button class="fab" onclick="newE()">${t('newExp')}</button>`:''}`}

function modal(h){closeM();const d=document.createElement('div');d.className='bd';d.id='md';d.onclick=e=>{if(e.target==d)closeM()};d.innerHTML='<div class="sheet">'+h+'</div>';document.body.appendChild(d)}
function closeM(){const d=$('#md');if(d)d.remove()}
function newG(){modal(`<h3>${t('newGroupTitle')}</h3><input id="gn" placeholder="${t('groupName')}"><div class="chips" id="ge">${['🏠','✈️','🍕','🎉','🚗','💼','❤️','👥'].map((e,i)=>`<button class="chip ${i==7?'on':''}" onclick="document.querySelectorAll('#ge .chip').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${e}</button>`).join('')}</div><button class="pri" onclick="saveG()">${t('create')}</button>`)}
async function saveG(){try{const n=$('#gn').value.trim();if(!n)return toast(t('needGroupName'));const e=$('#ge .on').textContent;const r=await sb.rpc('create_group',{p_name:n,p_emoji:e});if(r.error)throw r.error;closeM();await load();S.gid=r.data;S.tab='a';view()}catch(e){toast(t('err')+': '+e.message)}}
async function setGroupPhoto(file){if(!file)return;try{toast('...');const url=await uploadFile(file,'groups');const r=await sb.from('groups').update({photo_url:url}).eq('id',S.gid);if(r.error)throw r.error;await load();view();toast(t('added2'))}catch(e){toast(t('err')+': '+e.message)}}
function inferSplitMode(amount, splits){
 const n=splits.length;if(n<=1)return 'eq';
 const base=Math.floor(amount/n),rem=amount-base*n;
 const expected=Array.from({length:n},(_,i)=>base+(i<rem?1:0)).sort((a,b)=>b-a);
 const vals=splits.map(s=>Number(s.share)).sort((a,b)=>b-a);
 return vals.every((v,i)=>v==expected[i])?'eq':'ex';
}
function newE(existing){const ms=gmem(S.gid),me=myM(S.gid);
S.editId=existing?existing.id:null;
const exSplits=existing?existing.splits:null,exPayers=existing?payersOf(existing):null,exSingle=existing&&exSplits.length==1;
S.cat=existing?existing.category:'ovqat';
S.mode=existing?inferSplitMode(existing.amount,exSplits):'eq';
S.recFreq='none';S.photoData=null;
S.payers=existing?exPayers.map(p=>p[0]):[me?me.id:(ms[0]||{}).id];
const exSplitIds=existing?exSplits.map(s=>s.member_id):null;
const exAmtOf=id=>{if(!existing)return 0;const s=exSplits.find(s=>s.member_id==id);return s?Math.round(Number(s.share)):0};
modal(`<h3>${existing?t('edit'):t('newExpTitle')}</h3><input id="t" placeholder="${t('what')}" value="${existing?esc(existing.title):''}"><input id="am" type="number" inputmode="numeric" placeholder="${t('amount')}" value="${existing?Math.round(existing.amount):''}"><div class="chips" id="cc">${Object.entries(CATS).map(([k,c])=>`<button class="chip ${k==S.cat?'on':''}" onclick="S.cat='${k}';document.querySelectorAll('#cc .chip').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${c[0]} ${c[1][S.lang]}</button>`).join('')}</div>
<label>${t('whoPaid')}</label><div id="payersWrap"></div><button type="button" class="ghost" onclick="addPayerRow()">${t('addPayer')}</button>
<div class="card row" style="margin:10px 0"><label style="flex:1;margin:0"><input type="checkbox" id="single" ${exSingle?'checked':''} onchange="toggleSingle(this.checked)"> ${t('singleFor')}</label></div>
<div id="singleWrap" style="display:${exSingle?'block':'none'}"><label>${t('forWhom')}</label><select id="singleSel">${ms.map(m=>`<option value="${m.id}" ${exSingle&&exSplitIds[0]==m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>
<div id="splitWrap" style="display:${exSingle?'none':'block'}"><label>${t('splitWho')}</label><div class="seg"><button id="m1" class="${S.mode=='eq'?'on':''}" onclick="setMode('eq')">${t('eqSplit')}</button><button id="m2" class="${S.mode=='ex'?'on':''}" onclick="setMode('ex')">${t('exSplit')}</button></div>
${ms.map(m=>`<div class="sp"><label><input type="checkbox" class="ck" value="${m.id}" ${!existing||exSplitIds.includes(m.id)?'checked':''}>${esc(m.name)}</label><input class="ev" data-m="${m.id}" type="number" inputmode="numeric" placeholder="0" value="${existing?exAmtOf(m.id):''}" style="display:${S.mode=='ex'?'block':'none'}"></div>`).join('')}</div>
${existing?'':`<label>${t('recurring')}</label><select id="rf" onchange="S.recFreq=this.value"><option value="none">${t('recNo')}</option><option value="weekly">${t('recWeek')}</option><option value="monthly">${t('recMonth')}</option></select>`}
<input id="nt" placeholder="${t('note')}" value="${existing&&existing.note?esc(existing.note):''}"><label>${t('receipt')}</label><input type="file" accept="image/*" onchange="pickReceipt(this.files[0])"><div id="rprev">${existing&&existing.receipt_url?`<img class="thumb" src="${esc(existing.receipt_url)}">`:''}</div>
<button class="pri" onclick="saveE()">${t('save')}</button>`);
renderPayers();}
function editE(id){const e=S.exps.find(x=>x.id==id);if(e)newE(e)}
function toggleSingle(on){$('#singleWrap').style.display=on?'block':'none';$('#splitWrap').style.display=on?'none':'block'}
function renderPayers(){const ms=gmem(S.gid);$('#payersWrap').innerHTML=S.payers.map((pid,i)=>`<div class="payer"><select onchange="S.payers[${i}]=this.value">${ms.map(m=>`<option value="${m.id}" ${m.id==pid?'selected':''}>${esc(m.name)}</option>`).join('')}</select>${S.payers.length>1?`<input type="number" class="pamt" data-i="${i}" placeholder="0">`:''}${S.payers.length>1?`<button type="button" class="x" onclick="S.payers.splice(${i},1);renderPayers()">✕</button>`:''}</div>`).join('')}
function addPayerRow(){const ms=gmem(S.gid);const unused=ms.find(m=>!S.payers.includes(m.id));S.payers.push(unused?unused.id:ms[0].id);renderPayers()}
async function pickReceipt(file){if(!file)return;const r=new FileReader();r.onload=()=>{S.photoData=file;$('#rprev').innerHTML=`<img class="thumb" src="${r.result}">`};r.readAsDataURL(file)}
function setMode(m){S.mode=m;$('#m1').classList.toggle('on',m=='eq');$('#m2').classList.toggle('on',m=='ex');document.querySelectorAll('.ev').forEach(i=>i.style.display=m=='ex'?'block':'none')}
async function saveE(){try{const title=$('#t').value.trim(),amount=Math.round(Number($('#am').value)),note=$('#nt').value.trim();
 if(!title)return toast(t('needTitle'));if(!(amount>0))return toast(t('needAmount'));
 let sp;
 if($('#single').checked){const rid=$('#singleSel').value;sp=[[rid,amount]]}
 else{const ids=[...document.querySelectorAll('.ck:checked')].map(c=>c.value);if(!ids.length)return toast(t('needOne'));
 if(S.mode=='eq'){const b=Math.floor(amount/ids.length),r=amount-b*ids.length;sp=ids.map((id,i)=>[id,b+(i<r?1:0)])}
 else{sp=ids.map(id=>[id,Math.round(Number(document.querySelector('.ev[data-m="'+id+'"]').value)||0)]);const sum=sp.reduce((a,p)=>a+p[1],0);if(sum!=amount)return toast(t('sumMismatch',fmt(sum)))}}
 let payers;if(S.payers.length==1){payers=[[S.payers[0],amount]]}
 else{payers=S.payers.map((pid,i)=>[pid,Math.round(Number((document.querySelector('.pamt[data-i="'+i+'"]')||{}).value)||0)]);const sp2=payers.reduce((a,p)=>a+p[1],0);if(sp2!=amount)return toast(t('sumMismatch',fmt(sp2)))}
 let receiptUrl=S.editId?(S.exps.find(x=>x.id==S.editId)||{}).receipt_url||null:null;if(S.photoData){toast('...');receiptUrl=await uploadFile(S.photoData,'receipts')}
 if(S.editId){
  const r=await sb.rpc('update_expense_full',{p_expense_id:S.editId,p_title:title,p_amount:amount,p_category:S.cat,p_note:note||null,p_receipt:receiptUrl,
   p_payers:payers.map(p=>({member_id:p[0],amount:p[1]})),p_splits:sp.map(p=>({member_id:p[0],share:p[1]}))});
  if(r.error)throw r.error;
  closeM();await load();view();toast(t('expAdded'));return;
 }
 const r=await sb.rpc('add_expense_full',{p_group:S.gid,p_title:title,p_amount:amount,p_category:S.cat,p_note:note||null,p_receipt:receiptUrl,
  p_payers:payers.map(p=>({member_id:p[0],amount:p[1]})),p_splits:sp.map(p=>({member_id:p[0],share:p[1]}))});
 if(r.error)throw r.error;
 if($('#rf').value!='none'){const rt=await sb.from('recurring_templates').insert({group_id:S.gid,title,amount,category:S.cat,paid_by:payers[0][0],freq:$('#rf').value,
   split_json:sp.map(p=>({member_id:p[0],share:p[1]})),next_date:new Date(Date.now()+(($('#rf').value=='weekly')?7:30)*86400000).toISOString().slice(0,10)});if(rt.error)throw rt.error}
 closeM();await load();view();toast(t('expAdded'))}catch(e){toast(t('err')+': '+e.message)}}
function payModal(f,tt,max){modal(`<h3>${t('settled')}</h3><p><b>${esc((mem(f)||{}).name)}</b> → <b>${esc((mem(tt)||{}).name)}</b></p>
<label>${t('amount')} (${S.lang=='ru'?'максимум':'maksimum'} ${fmt(max)})</label><input id="pa" type="number" inputmode="numeric" value="${max}">
<div class="seg"><button onclick="document.getElementById('pa').value=${Math.round(max/2)}">50%</button><button onclick="document.getElementById('pa').value=${max}">100%</button></div>
<button class="pri" onclick="pay('${f}','${tt}',${max})">${t('save')}</button>`)}
async function pay(f,tt,max){try{const G=S.groups.find(x=>x.id==S.gid)||{};const toMem=mem(tt)||{};const isAdmin=S.me.id==G.created_by;const canConfirm=(!!toMem.user_id&&toMem.user_id==S.me.id)||(!toMem.user_id&&isAdmin);
 if(!canConfirm)return toast(t('onlyCreditor',esc(toMem.name)));
 const v=Math.round(Number(($('#pa')||{}).value));const a=($('#pa')?v:max);
 if(!(a>0))return toast(t('needAmount'));const amt=Math.min(a,max);
 const r=await sb.rpc('add_expense_full',{p_group:S.gid,p_title:t('payment'),p_amount:amt,p_category:'boshqa',p_note:null,p_receipt:null,
 p_payers:[{member_id:f,amount:amt}],p_splits:[{member_id:tt,share:amt}]});if(r.error)throw r.error;
 await sb.from('expenses').update({kind:'payment'}).eq('id',r.data);closeM();await load();view();toast(t('settledMsg'))}catch(e){toast(t('err')+': '+e.message)}}
async function delE(id){if(!confirm(t('delConfirm')))return;const r=await sb.from('expenses').delete().eq('id',id);if(r.error)return toast(r.error.message);await load();view()}
async function removeMember(id){if(!confirm(t('removeConfirm')))return;try{const r=await sb.rpc('remove_member',{p_member:id});if(r.error)throw r.error;await load();view();toast(t('removed'))}catch(e){toast(t('err')+': '+e.message)}}
async function addM(){try{const nm=$('#mn').value.trim(),ph=pn($('#mp').value);if(!ph)return toast(t('needPhoneValid'));
 if(gmem(S.gid).some(m=>m.phone==ph))return toast(t('already'));const r=await sb.rpc('add_member',{p_group:S.gid,p_name:nm,p_phone:ph});if(r.error)throw r.error;await load();view();toast(t('added2'))}catch(e){toast(t('err')+': '+e.message)}}
async function share(l){const G=S.groups.find(x=>x.id==S.gid),tx=`«${G.name}» ${S.lang=='ru'?'группе в Ulush':"guruhiga Ulush ilovasida qo'shiling"}:`;
 try{if(navigator.share)await navigator.share({title:'Ulush',text:tx,url:l});else{await navigator.clipboard.writeText(tx+' '+l);toast(t('linkCopied'))}}catch(e){try{await navigator.clipboard.writeText(l);toast(t('linkCopied'))}catch(_){toast(l)}}}
function csv(){const G=S.groups.find(x=>x.id==S.gid),q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const rows=[['Sana','Nomi','Toifa','Kim toladi','Summa']].concat(S.exps.filter(e=>e.group_id==S.gid).map(e=>[e.spent_on,e.title,e.category,(mem(e.paid_by)||{}).name,e.amount]));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='ulush-'+G.name+'.csv';a.click()}
(function(){const ORDER=['x','b','d','a','h'];let sx=0,sy=0,tracking=false;
 document.addEventListener('touchstart',e=>{if(!S.gid||$('#md')||e.touches.length>1){tracking=false;return}const t=e.touches[0];sx=t.clientX;sy=t.clientY;tracking=true},{passive:true});
 document.addEventListener('touchend',e=>{if(!tracking)return;tracking=false;if(!S.gid||$('#md'))return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;
  const i=ORDER.indexOf(S.tab);if(i<0)return;const ni=dx<0?i+1:i-1;if(ni<0||ni>=ORDER.length)return;S.tab=ORDER[ni];view()},{passive:true});
})();
boot();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script></body></html>
